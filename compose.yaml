services:
  clinic-flow:
    build: .
    environment:
      CLINIC_STAFF_PASSWORD: "${CLINIC_STAFF_PASSWORD:-}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - clinic-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  clinic-data:
