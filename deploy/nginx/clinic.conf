# Staging. Review and tune per facility before network exposure.
# Log URI only, never OIDC callback query strings, Authorization or cookies.
log_format clinic '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=clinic_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=clinic_checkin:10m rate=60r/m;

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/access.log clinic;
    # Nginx error logs may include a full request URI; restrict log access.
    error_log /var/log/nginx/error.log crit;
    client_max_body_size 32k;
    limit_req_status 429;

    # Metrics belong to a private monitoring network, not the public proxy.
    location = /metrics { return 404; }

    location /auth/ {
        limit_req zone=clinic_auth burst=20 nodelay;
        proxy_pass http://clinic-flow:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /api/check-in {
        limit_req zone=clinic_checkin burst=20 nodelay;
        proxy_pass http://clinic-flow:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /api/events {
        proxy_pass http://clinic-flow:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 40s;
    }

    location / {
        proxy_pass http://clinic-flow:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
