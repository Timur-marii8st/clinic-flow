name: Core tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clinic_test
          POSTGRES_USER: clinic_test
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic_test -d clinic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://clinic_test:local_ci_only@localhost:5432/clinic_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -rs
      - run: node --check app/static/app.js && node --check app/static/security.js && node --check app/static/audio.js
      - run: python scripts/smoke_sse.py
      - run: python -m scripts.smoke_postgres_backup
        env:
          CF_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
      - run: python -m scripts.load_smoke --postgres --screens 50 --staff 20 --kiosks 5 --seconds 8
      - run: python -m scripts.simulate_flow --patients 100 --seed 42
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: python -m scripts.build_audio
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/smoke_browser.py
      - run: python scripts/smoke_devices.py
      - run: bash -n deploy/kiosk/install.sh
